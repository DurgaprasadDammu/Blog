version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: blog_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blog_user:blog_password@db:5432/blog_db
      SECRET_KEY: change-this-to-a-long-random-secret-string
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COMMENT_RATE_LIMIT: 5/minute
      PROJECT_NAME: Blog Platform API
      ENV: development
    ports:
      - "8000:8000"

volumes:
  blog_postgres_data:
